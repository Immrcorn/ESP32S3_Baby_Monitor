<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Baby Monitor</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e8eef5;
      --muted: #8b9cb3;
      --accent: #4da3ff;
      --ok: #3dd68c;
      --alert: #ff5c5c;
      --alert-bg: rgba(255, 92, 92, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .status-dot.live {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .status-dot.alert {
      background: var(--alert);
      box-shadow: 0 0 10px var(--alert);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { opacity: 0.5; }
    }

    main {
      padding: 12px;
      max-width: 960px;
      margin: 0 auto;
    }

    .alert-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      background: var(--alert-bg);
      border: 1px solid var(--alert);
      color: #ffd0d0;
      font-weight: 600;
    }

    .alert-banner.active {
      display: flex;
    }

    .stream-wrap {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 4 / 3;
    }

    .stream-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .stream-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .panel {
      margin-top: 14px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .level-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .level-bar-track {
      flex: 1;
      height: 28px;
      background: #0b1018;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    .level-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3dd68c, #ffd166, #ff5c5c);
      transition: width 0.15s ease-out;
    }

    .level-bar-threshold {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #fff;
      opacity: 0.85;
      pointer-events: none;
    }

    .level-value {
      min-width: 3.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 1.1rem;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .footer-links {
      margin-top: 14px;
      text-align: center;
      font-size: 0.85rem;
    }

    .footer-links a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .stream-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .stream-controls button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .stream-controls button:active {
      background: #243044;
    }

    .sound-arm-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .sound-arm-btn.armed {
      border-color: var(--ok);
      color: var(--ok);
    }

    .sound-arm-btn:active {
      background: #243044;
    }

    @media (orientation: portrait) {
      .stream-wrap {
        aspect-ratio: auto;
        min-height: 50vh;
      }
    }

    @media (orientation: landscape) {
      .stream-wrap {
        aspect-ratio: auto;
        max-height: 75vh;
      }

      main {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Baby Monitor</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="connection-text" style="font-size:0.85rem;color:var(--muted);">Connecting…</span>
      <div id="status-dot" class="status-dot" title="Status"></div>
    </div>
  </header>

  <main>
    <div id="alert-banner" class="alert-banner">
      <span>🔔</span>
      <span>Sound alert — level above threshold</span>
    </div>

    <div class="stream-wrap">
      <div id="stream-placeholder" class="stream-placeholder">Starting camera stream…</div>
      <img id="stream" alt="Live camera feed" crossorigin>
    </div>

    <div class="stream-controls">
      <button type="button" id="btn-vflip">Flip vertical</button>
      <button type="button" id="btn-hmirror">Mirror</button>
    </div>

    <section class="panel">
      <h2>Sound Level</h2>

      <div class="level-row">
        <div class="level-bar-track">
          <div id="level-fill" class="level-bar-fill"></div>
          <div id="level-threshold" class="level-bar-threshold"></div>
        </div>
        <div id="level-value" class="level-value">—</div>
      </div>

      <label for="threshold">Alert threshold (<span id="threshold-value">45</span>)</label>
      <input id="threshold" type="range" min="5" max="95" value="45" step="1">

      <button type="button" id="btn-enable-sound" class="sound-arm-btn">
        Tap to enable alert audio
      </button>

      <div class="meta">
        <span id="burst-status">Idle</span>
        <span id="last-update">—</span>
      </div>
    </section>

    <p class="footer-links">
      <a href="/legacy">Advanced camera controls</a>
    </p>
  </main>

  <script>
    const POLL_MS = 300;
    const AUDIO_SAMPLE_RATE = 16000;
    const baseHost = document.location.origin;
    const streamUrl = baseHost.replace(/:\d+$/, '') + ':81/stream';

    const streamImg = document.getElementById('stream');
    const streamPlaceholder = document.getElementById('stream-placeholder');
    const levelFill = document.getElementById('level-fill');
    const levelThreshold = document.getElementById('level-threshold');
    const levelValue = document.getElementById('level-value');
    const thresholdInput = document.getElementById('threshold');
    const thresholdValue = document.getElementById('threshold-value');
    const alertBanner = document.getElementById('alert-banner');
    const burstStatus = document.getElementById('burst-status');
    const lastUpdate = document.getElementById('last-update');
    const statusDot = document.getElementById('status-dot');
    const connectionText = document.getElementById('connection-text');
    const btnVflip = document.getElementById('btn-vflip');
    const btnHmirror = document.getElementById('btn-hmirror');
    const btnEnableSound = document.getElementById('btn-enable-sound');

    let thresholdDirty = false;
    let lastBurst = false;
    let streamLive = false;
    let audioLive = false;
    let soundEnabled = false;
    let burstAudioPlaying = false;
    let audioContext = null;
    let audioAbortController = null;

    function getAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx({ sampleRate: AUDIO_SAMPLE_RATE });
      }
      return audioContext;
    }

    function updateSoundButton() {
      if (soundEnabled) {
        btnEnableSound.textContent = 'Alert audio armed';
        btnEnableSound.classList.add('armed');
      } else {
        btnEnableSound.textContent = 'Tap to enable alert audio';
        btnEnableSound.classList.remove('armed');
      }
    }

    async function enableSound() {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }
        soundEnabled = true;
        updateSoundButton();
      } catch (err) {
        soundEnabled = false;
        updateSoundButton();
      }
    }

    btnEnableSound.addEventListener('click', enableSound);

    async function startBurstAudio() {
      if (!soundEnabled || burstAudioPlaying) {
        return;
      }

      burstAudioPlaying = true;
      audioAbortController = new AbortController();

      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }

        const response = await fetch(baseHost + '/audio', {
          signal: audioAbortController.signal
        });
        if (!response.ok || !response.body) {
          return;
        }

        let playTime = ctx.currentTime + 0.15;
        let pending = new Uint8Array(0);
        const reader = response.body.getReader();

        while (true) {
          const result = await reader.read();
          if (result.done) {
            break;
          }

          const incoming = result.value;
          const merged = new Uint8Array(pending.length + incoming.length);
          merged.set(pending);
          merged.set(incoming, pending.length);
          pending = merged;

          const usable = pending.length - (pending.length % 2);
          if (usable < 2) {
            continue;
          }

          const chunk = pending.slice(0, usable);
          pending = pending.slice(usable);

          const samples = new Int16Array(
            chunk.buffer,
            chunk.byteOffset,
            usable / 2
          );
          const float32 = new Float32Array(samples.length);
          for (let i = 0; i < samples.length; i++) {
            float32[i] = samples[i] / 32768;
          }

          const buffer = ctx.createBuffer(1, float32.length, AUDIO_SAMPLE_RATE);
          buffer.copyToChannel(float32, 0);

          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          source.start(playTime);
          playTime += buffer.duration;
        }

        const waitMs = Math.max(0, (playTime - ctx.currentTime) * 1000);
        if (waitMs > 0) {
          await new Promise(function (resolve) {
            setTimeout(resolve, waitMs);
          });
        }
      } catch (err) {
        if (err && err.name !== 'AbortError') {
          console.error('Burst audio error', err);
        }
      } finally {
        burstAudioPlaying = false;
        audioAbortController = null;
      }
    }

    function updateConnectionStatus(burst) {
      if (burst) {
        statusDot.className = 'status-dot alert';
        connectionText.textContent = 'Alert';
        return;
      }
      if (streamLive && audioLive) {
        statusDot.className = 'status-dot live';
        connectionText.textContent = 'Live';
      } else if (streamLive) {
        statusDot.className = 'status-dot live';
        connectionText.textContent = 'Live · No audio';
      } else {
        statusDot.className = 'status-dot';
        connectionText.textContent = 'Offline';
      }
    }

    streamImg.onload = function () {
      streamPlaceholder.style.display = 'none';
      streamLive = true;
      updateConnectionStatus(lastBurst);
    };

    streamImg.onerror = function () {
      streamPlaceholder.textContent = 'Stream unavailable — retrying…';
      streamPlaceholder.style.display = 'grid';
      streamLive = false;
      updateConnectionStatus(lastBurst);
      setTimeout(function () {
        streamImg.src = streamUrl + '?t=' + Date.now();
      }, 2000);
    };

    streamImg.src = streamUrl;

    function updateThresholdMarker(value) {
      thresholdValue.textContent = value;
      levelThreshold.style.left = value + '%';
    }

    function setThreshold(value) {
      fetch(baseHost + '/set?value=' + encodeURIComponent(value))
        .catch(function () {});
    }

    thresholdInput.addEventListener('input', function () {
      thresholdDirty = true;
      updateThresholdMarker(thresholdInput.value);
    });

    thresholdInput.addEventListener('change', function () {
      setThreshold(thresholdInput.value);
      thresholdDirty = false;
    });

    function cameraControl(variable, value) {
      fetch(baseHost + '/control?var=' + encodeURIComponent(variable) + '&val=' + encodeURIComponent(value))
        .catch(function () {});
    }

    btnVflip.addEventListener('click', function () {
      fetch(baseHost + '/status')
        .then(function (r) { return r.json(); })
        .then(function (s) {
          cameraControl('vflip', s.vflip ? 0 : 1);
        })
        .catch(function () {
          cameraControl('vflip', 1);
        });
    });

    btnHmirror.addEventListener('click', function () {
      fetch(baseHost + '/status')
        .then(function (r) { return r.json(); })
        .then(function (s) {
          cameraControl('hmirror', s.hmirror ? 0 : 1);
        })
        .catch(function () {
          cameraControl('hmirror', 1);
        });
    });

    async function pollLevel() {
      try {
        const response = await fetch(baseHost + '/level');
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();
        const levelRaw = Number(data.level);
        const level = Number.isFinite(levelRaw) ? levelRaw : 0;
        const threshold = Number(data.threshold) || 45;
        const burst = Number(data.burst) === 1;
        audioLive = Number(data.audio_ok) === 1;

        levelFill.style.width = Math.min(100, Math.max(0, level)) + '%';
        levelValue.textContent = level.toFixed(1);

        if (!thresholdDirty) {
          thresholdInput.value = threshold;
          updateThresholdMarker(threshold);
        } else {
          updateThresholdMarker(thresholdInput.value);
        }

        alertBanner.classList.toggle('active', burst);
        burstStatus.textContent = burst ? 'Alert active' : (audioLive ? 'Idle' : 'Mic unavailable');
        updateConnectionStatus(burst);

        if (burst && !lastBurst) {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Baby Monitor', { body: 'Sound level above threshold' });
          }
          startBurstAudio();
        }
        lastBurst = burst;

        lastUpdate.textContent = new Date().toLocaleTimeString();
      } catch (err) {
        audioLive = false;
        burstStatus.textContent = streamLive ? 'No audio data' : 'No data';
        updateConnectionStatus(lastBurst);
      }
    }

    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    updateSoundButton();
    pollLevel();
    setInterval(pollLevel, POLL_MS);
  </script>
</body>
</html>
