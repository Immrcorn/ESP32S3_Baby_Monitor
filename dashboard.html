<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Baby Monitor</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e8eef5;
      --muted: #8b9cb3;
      --accent: #4da3ff;
      --ok: #3dd68c;
      --alert: #ff5c5c;
      --alert-bg: rgba(255, 92, 92, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .status-dot.live {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .status-dot.alert {
      background: var(--alert);
      box-shadow: 0 0 10px var(--alert);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { opacity: 0.5; }
    }

    main {
      padding: 12px;
      max-width: 960px;
      margin: 0 auto;
    }

    .alert-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      background: var(--alert-bg);
      border: 1px solid var(--alert);
      color: #ffd0d0;
      font-weight: 600;
    }

    .alert-banner.active {
      display: flex;
    }

    .stream-wrap {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 4 / 3;
    }

    .stream-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .stream-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .panel {
      margin-top: 14px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .level-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .level-bar-track {
      flex: 1;
      height: 28px;
      background: #0b1018;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    .level-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3dd68c, #ffd166, #ff5c5c);
      transition: width 0.15s ease-out;
    }

    .level-bar-threshold {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #fff;
      opacity: 0.85;
      pointer-events: none;
    }

    .level-value {
      min-width: 3.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 1.1rem;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .footer-links {
      margin-top: 14px;
      text-align: center;
      font-size: 0.85rem;
    }

    .footer-links a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Baby Monitor</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="connection-text" style="font-size:0.85rem;color:var(--muted);">Connecting…</span>
      <div id="status-dot" class="status-dot" title="Status"></div>
    </div>
  </header>

  <main>
    <div id="alert-banner" class="alert-banner">
      <span>🔔</span>
      <span>Sound alert — level above threshold</span>
    </div>

    <div class="stream-wrap">
      <div id="stream-placeholder" class="stream-placeholder">Starting camera stream…</div>
      <img id="stream" alt="Live camera feed" crossorigin>
    </div>

    <section class="panel">
      <h2>Sound Level</h2>

      <div class="level-row">
        <div class="level-bar-track">
          <div id="level-fill" class="level-bar-fill"></div>
          <div id="level-threshold" class="level-bar-threshold"></div>
        </div>
        <div id="level-value" class="level-value">—</div>
      </div>

      <label for="threshold">Alert threshold (<span id="threshold-value">45</span>)</label>
      <input id="threshold" type="range" min="5" max="95" value="45" step="1">

      <div class="meta">
        <span id="burst-status">Idle</span>
        <span id="last-update">—</span>
      </div>
    </section>

    <p class="footer-links">
      <a href="/legacy">Advanced camera controls</a>
    </p>
  </main>

  <script>
    const POLL_MS = 300;
    const baseHost = document.location.origin;
    const streamUrl = baseHost.replace(/:\d+$/, '') + ':81/stream';

    const streamImg = document.getElementById('stream');
    const streamPlaceholder = document.getElementById('stream-placeholder');
    const levelFill = document.getElementById('level-fill');
    const levelThreshold = document.getElementById('level-threshold');
    const levelValue = document.getElementById('level-value');
    const thresholdInput = document.getElementById('threshold');
    const thresholdValue = document.getElementById('threshold-value');
    const alertBanner = document.getElementById('alert-banner');
    const burstStatus = document.getElementById('burst-status');
    const lastUpdate = document.getElementById('last-update');
    const statusDot = document.getElementById('status-dot');
    const connectionText = document.getElementById('connection-text');

    let thresholdDirty = false;
    let lastBurst = false;

    streamImg.onload = function () {
      streamPlaceholder.style.display = 'none';
    };

    streamImg.onerror = function () {
      streamPlaceholder.textContent = 'Stream unavailable — retrying…';
      streamPlaceholder.style.display = 'grid';
      setTimeout(function () {
        streamImg.src = streamUrl + '?t=' + Date.now();
      }, 2000);
    };

    streamImg.src = streamUrl;

    function updateThresholdMarker(value) {
      thresholdValue.textContent = value;
      levelThreshold.style.left = value + '%';
    }

    function setThreshold(value) {
      fetch(baseHost + '/set?value=' + encodeURIComponent(value))
        .catch(function () {});
    }

    thresholdInput.addEventListener('input', function () {
      thresholdDirty = true;
      updateThresholdMarker(thresholdInput.value);
    });

    thresholdInput.addEventListener('change', function () {
      setThreshold(thresholdInput.value);
      thresholdDirty = false;
    });

    async function pollLevel() {
      try {
        const response = await fetch(baseHost + '/level');
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();
        const level = Number(data.level) || 0;
        const threshold = Number(data.threshold) || 45;
        const burst = Number(data.burst) === 1;

        levelFill.style.width = Math.min(100, Math.max(0, level)) + '%';
        levelValue.textContent = level.toFixed(1);

        if (!thresholdDirty) {
          thresholdInput.value = threshold;
          updateThresholdMarker(threshold);
        } else {
          updateThresholdMarker(thresholdInput.value);
        }

        alertBanner.classList.toggle('active', burst);
        burstStatus.textContent = burst ? 'Alert active' : 'Idle';
        statusDot.className = 'status-dot ' + (burst ? 'alert' : 'live');
        connectionText.textContent = burst ? 'Alert' : 'Live';

        if (burst && !lastBurst) {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Baby Monitor', { body: 'Sound level above threshold' });
          }
        }
        lastBurst = burst;

        lastUpdate.textContent = new Date().toLocaleTimeString();
      } catch (err) {
        statusDot.className = 'status-dot';
        connectionText.textContent = 'Offline';
        burstStatus.textContent = 'No data';
      }
    }

    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    pollLevel();
    setInterval(pollLevel, POLL_MS);
  </script>
</body>
</html>
